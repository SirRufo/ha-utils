blueprint:
  name: Fix Sonoff Cover Stop at End
  description: >
    Stoppt Sonoff-Rollos, die am Endanschlag nicht von selbst anhalten: Sobald
    ein Rollo 2 Sekunden in der Endposition (offen oder geschlossen) verharrt,
    wird stop_cover ausgelöst. Behebt das Problem, dass solche Rollos am
    Endanschlag weiterhin als "öffnend"/"schließend" gemeldet werden.

    Version: 2026-10-25.2

    Hinweis: Der Blueprint überwacht den Zustandswechsel opening -> open bzw.
    closing -> closed und wartet 2 Sekunden, bevor gestoppt wird. So wird ein
    versehentliches Stoppen bei kurzen Bewegungen vermieden.
  domain: automation
  source_url: https://github.com/SirRufo/ha-utils/blob/main/blueprints/sonoff_cover_fix_stop_at_end.yaml
  input:
    covers:
      name: Cover-Entitäten
      description: >
        Die Sonoff-Rollos, die am Endanschlag nicht automatisch stoppen.
      selector:
        entity:
          domain: cover
          multiple: true
trigger:
  - platform: state
    entity_id: !input covers
    from: opening
    to: open
    for: "00:00:02"
  - platform: state
    entity_id: !input covers
    from: closing
    to: closed
    for: "00:00:02"
action:
  - service: cover.stop_cover
    target:
      entity_id: "{{ trigger.entity_id }}"
mode: parallel
max: 10