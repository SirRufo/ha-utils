blueprint:
  name: Dynamischer Sonnenschutz für Rollläden
  source_url: https://github.com/SirRufo/ha-utils/blob/main/blueprints/sonnenschutz_rollladen_temperatur_sonnenstand.yaml
  description: >
    Fährt Rollläden herunter, wenn die Sonne direkt auf das Fenster scheint
    (Prüfung über Fenster-Ausrichtung, Einbauwinkel und Sonnenstand per Einfallswinkel)
    UND ein Temperatursensor einen Schwellwert überschreitet (innen zu warm).

    - Tagsüber bei Sonne + Hitze: Fahre auf einstellbare Schutzposition
    - Sonne unter Höhen-Schwelle ODER nach Schließzeit: komplett schließen (Abendschutz / Sichtschutz)
    - Sonne über Höhen-Schwelle UND nach Öffnungszeit: komplett öffnen (morgens / keine Hitze),
      aber nur wenn der Behang noch auf Nacht- oder Schutzposition steht (manuelle Positionen bleiben unangetastet)
    - Fensterkontakt (Pflicht): bei offenem Fenster mindestens auf Lüftungsposition
      hochfahren, Abend-Schließung und Sonnenschutz fahren dann nie darunter.
      Per Schalter Minimalschließung abschaltbar (Kontakt wird dann ignoriert).

    Version: 2026-10-13.6

    Hinweis: Pro Himmelsrichtung eine Automation aus diesem Blueprint anlegen,
    da alle Rollläden einer Automation dieselbe Ausrichtung teilen.
  domain: automation
  input:
    rolllaeden:
      name: Rollläden
      description: Zu steuernde Rollläden / Covers (alle mit gleicher Fenster-Ausrichtung).
      selector:
        target:
          entity:
            - domain: cover
    temperatursensor:
      name: Temperatursensor (innen)
      description: Innentemperatur. Überschreitet sie die Schwelle, wird Sonnenschutz aktiv.
      selector:
        entity:
          filter:
            - device_class: temperature
              domain: sensor
    temperatur_schwelle:
      name: Temperatur-Schwellwert
      description: Ab dieser Innentemperatur (°C) wird bei Sonne auf Schutzposition gefahren.
      default: 24
      selector:
        number:
          min: 18
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider
    fenster_ausrichtung:
      name: Fenster-Ausrichtung (Azimut)
      description: >
        Himmelsrichtung, in die das Fenster zeigt (Azimut in Grad):
        0 = Nord, 90 = Ost, 180 = Süd, 270 = West.
        Für Dachfenster mit Neigung: Horizontale Projektion der Scheibennormalen angeben.
      default: 180
      selector:
        number:
          min: 0
          max: 360
          step: 1
          unit_of_measurement: "°"
          mode: slider
    fenster_neigung:
      name: Fenster-Neigung (Einbauwinkel)
      description: >
        Neigung der Scheibe gegen die Horizontale: 90 = senkrechtes Fenster,
        45 = Dachfenster, 0 = waagerechter Lichtschacht im Flachdach.
        Zusammen mit der Sonnenhöhe wird daraus der Lichteinfall berechnet.
      default: 90
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: "°"
          mode: slider
    azimuth_toleranz:
      name: Azimut-Toleranz
      description: >
        Wie weit darf der Sonnen-Azimut von der Fenster-Ausrichtung abweichen,
        damit noch von direkter Sonne ausgegangen wird (± Grad).
      default: 45
      selector:
        number:
          min: 10
          max: 90
          step: 1
          unit_of_measurement: "°"
          mode: slider
    umgebungs_abschattung:
      name: Umgebungs-Abschattung (Horizonthöhe)
      description: >
        Mindest-Sonnenhöhe in Grad, ab der direkte Sonne das Fenster überhaupt
        erreichen kann. Liegt die Sonne tiefer, wird Verschattung durch die Umgebung
        angenommen (Bäume, Häuser, Berge) und kein Sonnenschutz ausgelöst.
        Beispiel: 15, wenn Nachbarhäuser die tiefe Sonne verdecken.
      default: 2
      selector:
        number:
          min: 0
          max: 40
          step: 0.5
          unit_of_measurement: "°"
          mode: slider
    fensterkontakt:
      name: Fensterkontakt
      description: >
        Öffnungssensor (Fenstergriff / Reedkontakt, on = offen). Pflichtfeld.
        Wirkt nur, wenn die Minimalschließung aktiviert ist: Solange das Fenster
        offen ist, fahren die Rollläden mindestens auf Lüftungsposition hoch und
        die Abend-Schließung wird ausgesetzt. Reaktion spätestens im nächsten
        5-Minuten-Takt.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - window
                - door
                - opening
    minimalschliessung:
      name: Minimalschließung bei offenem Fenster
      description: >
        Wenn aktiv, fahren die Rollläden bei offenem Fensterkontakt mindestens
        auf Lüftungsposition hoch; Abend-Schließung und Sonnenschutz fahren dann
        nie darunter. Wenn inaktiv, wird der Fensterkontakt ignoriert.
      default: true
      selector:
        boolean: {}
    lueftungsposition:
      name: Lüftungsposition (Mindestposition bei offenem Fenster)
      description: >
        Fahren die Rollläden mindestens so weit hoch (100 = offen, 0 = geschlossen),
        solange der Fensterkontakt offen meldet. Wirkt nur, wenn die Minimalschließung
        aktiviert ist. Typisch: 15–30, damit ein gekipptes Fenster freigängig bleibt.
      default: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    schutzposition:
      name: Sonnenschutz-Position
      description: >
        Position für Sonnenschutz (100 = offen, 0 = geschlossen).
        Typisch: 15–40 für Behang mit Lichtschlitzen.
      default: 25
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    positionstoleranz:
      name: Positions-Toleranz
      description: >
        Keine Aktion, wenn die aktuelle Position bereits innerhalb dieser
        Abweichung (± %) zur Zielposition liegt. Verhindert unnötige Fahrbefehle.
      default: 3
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: "%"
          mode: slider
    sonnenhoehe_schwelle:
      name: Sonnenhöhen-Schwelle (Elevation)
      description: >
        Sonnenhöhe in Grad, darf auch negativ sein (Sonne unter Horizont,
        z.B. -4 für Schließen erst nach Sonnenuntergang).
        Darunter = tiefe Sonne / Abend -> komplett schließen.
        Darüber + nach Öffnungszeit -> öffnen (wenn kein Hitzeschutz nötig).
      default: 12
      selector:
        number:
          min: -20
          max: 40
          step: 0.5
          unit_of_measurement: "°"
          mode: slider
    oeffnungszeit:
      name: Früheste Öffnungszeit
      description: Vor dieser Uhrzeit wird morgens nicht geöffnet.
      default: "07:00:00"
      selector:
        time: {}
    schliesszeit:
      name: Späteste Zeit für Abend-Schließung
      description: Ab dieser Uhrzeit werden die Rollläden immer geschlossen, egal wie hoch die Sonne steht.
      default: "21:00:00"
      selector:
        time: {}

mode: restart
max_exceeded: silent

variables:
  rolllaeden: !input rolllaeden
  temperatursensor: !input temperatursensor
  temperatur_schwelle: !input temperatur_schwelle
  fenster_ausrichtung: !input fenster_ausrichtung
  fenster_neigung: !input fenster_neigung
  azimuth_toleranz: !input azimuth_toleranz
  umgebungs_abschattung: !input umgebungs_abschattung
  fensterkontakt: !input fensterkontakt
  minimalschliessung: !input minimalschliessung
  lueftungsposition: !input lueftungsposition
  schutzposition: !input schutzposition
  positionstoleranz: !input positionstoleranz
  sonnenhoehe_schwelle: !input sonnenhoehe_schwelle
  oeffnungszeit: !input oeffnungszeit
  schliesszeit: !input schliesszeit

trigger:
  - platform: state
    entity_id: sun.sun
  - platform: state
    entity_id: !input temperatursensor
  - platform: time_pattern
    minutes: /5
  - platform: time
    at: !input oeffnungszeit
  - platform: time
    at: !input schliesszeit

condition: []

action:
  - variables:
      sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(-90) }}"
      sun_azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
      azimuth_diff: "{{ (((sun_azimuth | float(0) - fenster_ausrichtung | float(180) + 540) % 360) - 180) | abs }}"
      sonne_auf_fenster: >
        {# Einfallswinkel: cos(Einfall) = Skalarprodukt aus Sonnenvektor und Scheibennormale.
           Scheibennormale zeigt auf Höhe (90 - Neigung) in Fenster-Ausrichtung.
           > 0.05 heißt: Sonne trifft die Scheibe (Einfallswinkel < ca. 87°).
           Bei fast waagerechten Scheiben (Neigung <= 10°) entfällt die Azimut-Prüfung. #}
        {% set e = (sun_elevation | float(-90)) * pi / 180 %}
        {% set ne = (90 - (fenster_neigung | float(90))) * pi / 180 %}
        {% set d = ((sun_azimuth | float(0)) - (fenster_ausrichtung | float(180))) * pi / 180 %}
        {% set kos_einfall = cos(e) * cos(ne) * cos(d) + sin(e) * sin(ne) %}
        {% set az_ok = ((fenster_neigung | float(90)) <= 10)
           or (azimuth_diff | float(90) < azimuth_toleranz | float(45)) %}
        {{ kos_einfall > 0.05 and az_ok and (sun_elevation | float(-90) > umgebungs_abschattung | float(2)) }}
      ist_zu_warm: >
        {{ states(temperatursensor) | float(-99) > temperatur_schwelle | float(24) }}
      sonne_tief: "{{ sun_elevation | float(-90) < sonnenhoehe_schwelle | float(12) }}"
      sonne_hoch: "{{ sun_elevation | float(-90) >= sonnenhoehe_schwelle | float(12) }}"
      nach_oeffnung: "{{ now() >= today_at(oeffnungszeit) }}"
      nach_schliessung: "{{ now() >= today_at(schliesszeit) }}"
      im_tagfenster: "{{ nach_oeffnung and not nach_schliessung }}"
      fenster_offen: "{{ minimalschliessung and has_value(fensterkontakt) and is_state(fensterkontakt, 'on') }}"
  - choose:
      # 0. Fenster offen: mindestens auf Lüftungsposition hochfahren (Freigängigkeit).
      # Höchste Priorität, gilt Tag und Nacht. Ohne Kontakt nie aktiv.
      - conditions:
          - condition: template
            value_template: "{{ fenster_offen }}"
        sequence:
          - variables:
              lueftung_fahren: >
                {% set ns = namespace(ids=[]) %}
                {% set ziel = lueftungsposition | float(20) %}
                {% set tol = positionstoleranz | float(3) %}
                {% for c in expand(rolllaeden.entity_id | default([])) %}
                  {% set pos = c.attributes.get('current_position', none) %}
                  {% if pos is none %}
                    {% if c.state == 'closed' and (ziel - tol) > 0 %}
                      {% set ns.ids = ns.ids + [c.entity_id] %}
                    {% endif %}
                  {% elif pos | float(100) < (ziel - tol) %}
                    {% set ns.ids = ns.ids + [c.entity_id] %}
                  {% endif %}
                {% endfor %}
                {{ ns.ids }}
          - condition: template
            value_template: "{{ lueftung_fahren | count > 0 }}"
          - service: cover.set_cover_position
            target:
              entity_id: "{{ lueftung_fahren }}"
            data:
              position: !input lueftungsposition
      # 1. Abend / Nacht: tiefstehende Sonne ODER nach Schließzeit -> komplett zu
      # Nur Rollläden anfahren, die nicht bereits geschlossen sind.
      # Bei offenem Fenster ausgesetzt (Branch 0 sichert die Lüftungsposition).
      - conditions:
          - condition: and
            conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ sonne_tief }}"
                  - condition: template
                    value_template: "{{ nach_schliessung }}"
              - condition: template
                value_template: "{{ not fenster_offen }}"
        sequence:
          - variables:
              zu_fahren: >
                {% set ns = namespace(ids=[]) %}
                {% set tol = positionstoleranz | float(3) %}
                {% for c in expand(rolllaeden.entity_id | default([])) %}
                  {% set pos = c.attributes.get('current_position', none) %}
                  {% if c.state != 'closed' and (pos is none or pos | float(100) > tol) %}
                    {% set ns.ids = ns.ids + [c.entity_id] %}
                  {% endif %}
                {% endfor %}
                {{ ns.ids }}
          - condition: template
            value_template: "{{ zu_fahren | count > 0 }}"
          - service: cover.close_cover
            target:
              entity_id: "{{ zu_fahren }}"
      # 2. Sonnenschutz: Sonne auf Fenster + zu warm + hoch genug + im Zeitfenster -> Schutzposition
      # Nur Rollläden anfahren, deren Position außerhalb der Toleranz liegt.
      # Bei offenem Fenster nie unter die Lüftungsposition fahren (Branch 0 sichert das Minimum).
      - conditions:
          - condition: template
            value_template: "{{ sonne_auf_fenster and ist_zu_warm and sonne_hoch and im_tagfenster }}"
        sequence:
          - variables:
              schutz_fahren: >
                {% set ns = namespace(ids=[]) %}
                {% set ziel = schutzposition | float(25) %}
                {% set tol = positionstoleranz | float(3) %}
                {% set mindest = lueftungsposition | float(20) %}
                {% set schutz_erlaubt = (not fenster_offen) or (ziel >= mindest - tol) %}
                {% if schutz_erlaubt %}
                  {% for c in expand(rolllaeden.entity_id | default([])) %}
                    {% set pos = c.attributes.get('current_position', none) %}
                    {% if pos is none or ((pos | float(ziel) - ziel) | abs > tol) %}
                      {% set ns.ids = ns.ids + [c.entity_id] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.ids }}
          - condition: template
            value_template: "{{ schutz_fahren | count > 0 }}"
          - service: cover.set_cover_position
            target:
              entity_id: "{{ schutz_fahren }}"
            data:
              position: !input schutzposition
      # 3. Morgen / Normal: Sonne hoch + nach Öffnung + im Zeitfenster -> auf (kein Hitzeschutz nötig)
      # Manueller Eingriff wird respektiert: nur öffnen, wenn der Behang noch auf
      # der erwarteten Nachtposition (zu) oder Schutzposition steht (± Toleranz).
      # Hinweis: Der State darf hier NICHT geprüft werden - ein Behang auf
      # Schutzposition meldet 'open' (Position > 0) und würde sonst nie öffnen.
      - conditions:
          - condition: template
            value_template: "{{ sonne_hoch and nach_oeffnung and im_tagfenster }}"
        sequence:
          - variables:
              auf_fahren: >
                {% set ns = namespace(ids=[]) %}
                {% set tol = positionstoleranz | float(3) %}
                {% set ziel = schutzposition | float(25) %}
                {% for c in expand(rolllaeden.entity_id | default([])) %}
                  {% set pos = c.attributes.get('current_position', none) %}
                  {% if pos is none %}
                    {% if c.state == 'closed' %}
                      {% set ns.ids = ns.ids + [c.entity_id] %}
                    {% endif %}
                  {% else %}
                    {% set erwartet_nacht = pos | float(100) <= tol %}
                    {% set erwartet_schutz = ((pos | float(ziel) - ziel) | abs <= tol) %}
                    {% set braucht_oeffnung = pos | float(0) < (100 - tol) %}
                    {% if braucht_oeffnung and (erwartet_nacht or erwartet_schutz) %}
                      {% set ns.ids = ns.ids + [c.entity_id] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.ids }}
          - condition: template
            value_template: "{{ auf_fahren | count > 0 }}"
          - service: cover.open_cover
            target:
              entity_id: "{{ auf_fahren }}"
    default: []
