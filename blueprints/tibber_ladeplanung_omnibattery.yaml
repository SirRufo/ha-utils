blueprint:
  name: Tibber-Ladeplanung für Omnibattery (Laden per Plan, Entladen per KI)
  description: |
    Erstellt aus Tibber-Preisen (Aktion `tibber.get_prices`) ein optimiertes
    Ladefenster und steuert nur das LADEN des Marstek Venus A (mit
    Erweiterungsmodul). Das ENTLADEN bleibt beim KI-Modus der Batterie:
    außerhalb des Ladefensters gibt die Automation die manuelle Kontrolle
    frei, sodass die Batterie-KI wieder übernimmt.

    Ablauf:

    1. Planung (00:05, 13:05 Uhr, stündlich, bei Neustart): Holt heute plus
       morgen per `tibber.get_prices` (Morgenpreise kommen ca. 13 Uhr). Die
       Abendspitze wird dynamisch als teuerstes zusammenhängendes Fenster
       zwischen 12 und 24 Uhr erkannt. Aus den Slots davor werden die N billigsten für
       die fehlende Energie gewählt (Ziel-SoC − Ist-SoC mal Sensorkapazität,
       max. 1,2 kW, Slotdauer aus den Preisdaten). Geladen wird nur,
       wenn (Abendpreis × Wirkungsgrad − Kaufpreis) / Kaufpreis über der
       Mindestmarge liegt. Der Plan landet in den Helfern und als
       laufend aktualisierter Dauer-Benachrichtigung (Lade- und
       Entladefenster) im Postfach.

    2. Volladung: Ab 7 Tagen seit der letzten Volladung wird angestrebt, einmal
       auf 100 % zu laden, sobald der billigste Slot im Horizont unter der
       Günstig-Schwelle liegt. Spätestens nach Anstreben plus Offset
       (Standard 7 + 10 Tage) wird erzwungen (dann im billigsten Fenster
       des Tages). Eine erkannte Volladung (SoC ≥ 99 %)
       setzt den Zähler zurück.

    3. Steuerung (bei Preis-, SoC-, Inverter- oder Akku-Preis-Änderung,
       stündlich als Fallback): Zwei Selects bilden zusammen die drei
       Betriebsarten der Batterie.

       Laden — Fenster, SoC unter Ziel (Max-SoC bzw. 100 % bei
       Volladung) und Preis unter Limit: Benutzer-Modus `manual`,
       dann feste Sequenz Battery Manual Mode einschalten → Erzwungener
       Modus auf Laden → Ladeleistung setzen. Bleibt der Wechselrichter
       dann nicht im Ladezustand, wird die Integration neu geladen und
       die Sequenz einmal wiederholt.

       Ruhe — SoC fällt auf Min-SoC (Reserve, 5 % Hysterese) oder der
       aktuelle Preis liegt nicht über dem Kaufpreis-Limit:
       Benutzer-Modus `manual`, Erzwungener Modus auf nichts. Die
       Batterie entlädt dann nicht selbst.

       Entladen — aktueller Preis über dem Kaufpreis-Limit:
       Erzwungener Modus zuerst auf nichts, dann Benutzer-Modus auf die
       Entlade-Option. Die Batterie entlädt.

       Die Reihenfolge ist wichtig. Beim Laden zuerst der Benutzer-Modus
       und dann Battery Manual Mode, weil beide dasselbe Firmware-Byte
       sind und ein Schreibvorgang den Steuermodus sonst wieder beenden
       würde. Battery Manual Mode wird einmal eingeschaltet und nie wieder
       ausgeschaltet.

       Beim Entladen ist die Reihenfolge genau umgekehrt: zuerst der
       Erzwungene Modus auf nichts, dann der Benutzer-Modus auf die
       Entlade-Option — sonst räumt der Benutzer-Modus den Erzwungenen
       Modus wieder ab.

    Benötigte Helfer (Einstellungen → Geräte & Dienste → Helfer):

    - 2× Datum/Uhrzeit MIT Datum und Uhrzeit: Ladefenster-Start, Ladefenster-Ende
      (wichtig: beide Häkchen setzen, sonst lädt die Steuerung nie)
    - 1× Nummer: Kaufpreis-Limit in EUR/kWh (Schritt 0,005)
    - 1× Datum/Uhrzeit NUR Datum: letzte Volladung
    - 1× Schalter: Volladung aktiv (input_boolean)
    - 1× Nummer: Akku-Preis (input_number, EUR/kWh) aus dem Blueprint
      „Akku-Preis pro kWh" (wird für die Entladeentscheidung verwendet)
    - optional 1× Datum/Uhrzeit MIT Datum und Uhrzeit: Sperre Neuladen

    Beim Laden schreibt der Blueprint die Einstellungen immer in dieser
    Reihenfolge: Battery Manual Mode einschalten, Force Mode auf `Charge`,
    Ladeleistung setzen. Die Reihenfolge ist zwingend — jede andere
    Reihenfolge bleibt wirkungslos.

    Antwortet der Wechselrichter danach nicht mit dem Ladezustand, wird die
    Omnibattery-Integration neu geladen und die Ladesequenz einmal
    wiederholt (höchstens alle 6 Stunden).

    Hinweis: `user_work_mode` (Modbus 43000) und `battery_manual_mode` (42000)
    sind in der Firmware dasselbe Byte — jeder Schreibvorgang auf das eine
    beendet das andere. Deshalb schreibt der Blueprint den Benutzer-Modus
    zuerst und den Steuermodus danach, und dieser bleibt dann eingeschaltet.

    Ohne eingeschalteten Battery Manual Mode reagiert die Batterie nicht
    auf Modbus-Befehle. Nur mit dem Erzwungenen Modus auf Laden lädt sie
    wirklich; `set_charge_power` allein genügt nicht. Die Optionswerte des
    Erzwungenen Modus sind je nach Firmware `Charge` oder `charge` und
    `None`, `standby` oder `stop`; der Blueprint liest sie aus den
    Optionen der Entität und muss darum nicht angepasst werden.

    Die Reserve ist eine Betriebsart, keine harte Sperre: `manual` ohne
    erzwungenen Modus heißt „nicht selbst entladen". Eine echte
    SoC-Sperre gibt es über Modbus nicht — die gehört in die Marstek-App.

    Weil die Firmware den Automatik-Modus als `anti_feed` zurückliest,
    prüft die Automation den Zustand des Erzwungenen Modus zuverlässig
    und den Benutzer-Modus nur auf `manual` oder „nicht `manual`". Es
    wird also nur bei echten Wechseln geschrieben.

    Version: 2026-10-18.3
  domain: automation
  source_url: https://github.com/SirRufo/ha-utils/blob/main/blueprints/tibber_ladeplanung_omnibattery.yaml
  input:
    price_sensor:
      name: Aktueller Strompreis
      description: Aktueller Bezugspreis in EUR/kWh (z. B. Tibber-Sensor).
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: monetary
    tibber_home:
      name: Tibber-Heim (optional)
      description: >
        Name des Heims aus der `tibber.get_prices`-Antwort (Schlüssel unter
        `prices`). Leer lassen = erstes Heim nehmen.
      default: ""
      selector:
        text:
    soc_sensor:
      name: Batterie-SoC
      description: Ladezustand in % (z. B. sensor.marstek_venus_1_battery_soc).
      default: sensor.marstek_venus_1_battery_soc
      selector:
        entity:
          filter:
            - domain: sensor
    inverter_state_sensor:
      name: Inverter-Zustand
      description: >
        Sensor für den Betriebszustand des Wechselrichters (z. B.
        sensor.marstek_venus_1_inverter_state). Er wird nach dem Schreiben
        der Ladeeinstellungen abgefragt: Erreicht er den Wert aus
        „Zustandswert beim Laden" nicht rechtzeitig, wird die
        Omnibattery-Integration neu geladen und die Ladesequenz wiederholt.
      default: sensor.marstek_venus_1_inverter_state
      selector:
        entity:
          filter:
            - domain: sensor
    inverter_charge_value:
      name: Zustandswert beim Laden
      description: >
        Wert, den der Inverter-Zustandssensor während des Ladens meldet
        (in der Firmware `Charge`). Wird für die Erfolgsprüfung nach dem
        Schreiben der Ladeeinstellungen verwendet.
      default: Charge
      selector:
        text:
    charge_power_number:
      name: Ladeleistung (Setpoint)
      description: Marstek-Modbus-Number für die Ladeleistung in W.
      default: number.marstek_venus_1_set_charge_power
      selector:
        entity:
          filter:
            - domain: number
    work_mode_select:
      name: Benutzer-Modus (User Work Mode)
      description: >
        Marstek-Modbus-Select für den Arbeitsmodus (Modbus 43000).
        Zusammen mit dem Erzwungenen Modus steuert er Laden UND Entladen.
        Optionen sind `manual` (nur Modbus-Kommandos) und `anti_feed`
        (Nulleinspeisung bzw. Automatik).
      default: select.marstek_venus_1_user_work_mode
      selector:
        entity:
          filter:
            - domain: select
    work_mode_ai:
      name: Entlade-Option
      description: >
        Optionswert, in den der Benutzer-Modus außerhalb des Ladefensters
        und oberhalb von Min-SoC gesetzt wird. Laut Firmware ist das der
        Automatik-Modus; neuere Integrationsversionen bieten zusätzlich
        `ai` bzw. `trade_mode` an.
      default: anti_feed
      selector:
        select:
          options:
            - anti_feed
            - ai
            - trade_mode
          mode: dropdown
    battery_price_sensor:
      name: Akku-Preis (Durchschnittspreis pro kWh)
      description: >
        input_number-Helfer in EUR/kWh, der den laufenden
        Durchschnittspreis des gespeicherten Stroms enthält (z. B. aus
        dem Blueprint „Akku-Preis pro kWh"). Wird für die
        Entladeentscheidung verwendet: Entladen nur, wenn der aktuelle
        Preis den Durchschnittspreis (nach Wirkungsgrad) über der
        Mindestmarge übersteigt.
      selector:
        entity:
          filter:
            - domain: input_number
    force_mode_select:
      name: Erzwungener Modus (Force Mode)
      description: >
        Marstek-Modbus-Select (Modbus 42010). Nur mit ihm lädt die
        Batterie wirklich; ohne ihn bleibt `set_charge_power` wirkungslos.
        Muss in der Integration aktiviert sein, sonst gibt es die Entität
        nicht. Die Optionswerte für Laden und Pause liest der Blueprint
        aus dieser Entität, weil ihre Bezeichnung je nach Firmware und
        Version wechselt.
      default: select.marstek_venus_1_force_mode
      selector:
        entity:
          filter:
            - domain: select
    manual_mode_switch:
      name: Battery Manual Mode
      description: >
        Marstek-Modbus-Schalter (Modbus 42000). Muss eingeschaltet sein,
        damit die Batterie auf Modbus-Befehle reagiert. Der Blueprint
        schaltet ihn vor dem Laden ein und danach nie wieder aus.
      default: switch.marstek_venus_1_battery_manual_mode
      selector:
        entity:
          filter:
            - domain: switch
    verify_timeout:
      name: Prüffrist Inverter (s)
      description: >
        Wie lange nach dem Schreiben der Ladeeinstellungen auf den
        Ladezustand des Inverters gewartet wird, bevor die Integration neu
        geladen wird.
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: s
          mode: box
    reload_wait:
      name: Wartezeit nach Neuladen (s)
      description: >
        Wartezeit, bis die neu geladene Integration wieder Werte liefert.
      default: 30
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: s
          mode: box
    config_entry_id:
      name: Config-Entry-ID Omnibattery (optional)
      description: >
        ID des Omnibattery-Integrationseintrags (Einstellungen → Geräte &
        Dienste → Omnibattery → Konfiguration → ID). Wird nur für den
        Notfall-Neuladungsversuch gebraucht: Geht der Inverter nach dem
        Schreiben der Ladeeinstellungen nicht auf `Charge`, wird dieser
        Eintrag neu geladen und die Ladesequenz einmal wiederholt. Leer
        lassen deaktiviert den Neuladungsversuch.
      default: ""
      selector:
        text:
    reload_cooldown:
      name: Sperre Neuladen (optional)
      description: >
        input_datetime-Helfer MIT Datum und Uhrzeit. Er wird vor jedem
        Notfall-Neuladen gesetzt und verhindert, dass die Integration
        höchstens einmal alle 6 Stunden neu geladen wird. Leer lassen
        erlaubt das Neuladen bei jedem fehlgeschlagenen Ladeversuch.
      selector:
        entity:
          filter:
            - domain: input_datetime
    helper_start:
      name: Helfer Ladefenster-Start
      description: input_datetime-Helfer MIT Datum und Uhrzeit für den Ladebeginn.
      selector:
        entity:
          filter:
            - domain: input_datetime
    helper_end:
      name: Helfer Ladefenster-Ende
      description: input_datetime-Helfer MIT Datum und Uhrzeit für das Ladeende.
      selector:
        entity:
          filter:
            - domain: input_datetime
    helper_buy_limit:
      name: Helfer Kaufpreis-Limit
      description: >
        input_number-Helfer in EUR/kWh. Die Planung schreibt hier den teuersten
        Slotpreis des Ladefensters plus 2 ct Toleranz hinein. Die Steuerung
        lädt nur, solange der aktuelle Preis darunter liegt.
      selector:
        entity:
          filter:
            - domain: input_number
    helper_last_full:
      name: Helfer letzte Volladung
      description: input_datetime-Helfer NUR mit Datum für die letzte Volladung.
      selector:
        entity:
          filter:
            - domain: input_datetime
    helper_full_flag:
      name: Helfer Volladung aktiv
      description: input_boolean-Helfer, markiert eine anstehende Volladung.
      selector:
        entity:
          filter:
            - domain: input_boolean
    capacity_sensor:
      name: Batteriekapazität
      description: Sensor mit der Bruttokapazität in kWh (z. B. Venus A + Modul = 4,24).
      default: sensor.marstek_venus_1_battery_total_energy
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: energy
    max_charge_w:
      name: Max. Ladeleistung (W)
      default: 1200
      selector:
        number:
          min: 100
          max: 1500
          step: 50
          unit_of_measurement: W
          mode: box
    efficiency_pct:
      name: Roundtrip-Wirkungsgrad (%)
      description: Gemessen ca. 82,9 % (AC zu AC).
      default: 82.9
      selector:
        number:
          min: 50
          max: 100
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    min_margin_pct:
      name: Mindestmarge (%)
      description: >
        Laden nur wenn (Abendpreis × Wirkungsgrad − Kaufpreis) / Kaufpreis
        darüber liegt.
      default: 5
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "%"
          mode: box
    min_soc:
      name: Min-SoC (%)
      description: Bei diesem SoC bleibt der Benutzer-Modus auf `manual` (Reserve).
      default: 20
      selector:
        number:
          min: 5
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_soc:
      name: Max-SoC (%)
      description: Bei diesem SoC endet das normale Laden.
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    full_from_days:
      name: Volladung anstreben ab (Tage)
      description: Ab so vielen Tagen seit letzter Volladung laden, wenn billig.
      default: 7
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    full_offset_days:
      name: Volladung-Offset (Tage)
      description: Zwang ab Anstreben plus Offset (0–14, Standard 7 + 10 Tage).
      default: 10
      selector:
        number:
          min: 0
          max: 14
          step: 1
          unit_of_measurement: d
          mode: box
    full_cheap_price:
      name: Günstig-Schwelle Volladung (EUR/kWh)
      description: Volladung ab der Anstreb-Schwelle, wenn der billigste Slot darunter liegt.
      default: 0.30
      selector:
        number:
          min: 0.05
          max: 1.0
          step: 0.005
          unit_of_measurement: EUR/kWh
          mode: box
    peak_window_hours:
      name: Dauer des Spitzenfensters (h)
      description: Fensterlänge für die dynamische Erkennung (Standard 4 h).
      default: 4
      selector:
        number:
          min: 1
          max: 8
          step: 0.25
          unit_of_measurement: h
          mode: box

mode: queued
max_exceeded: silent

variables:
  price_sensor: !input price_sensor
  tibber_home: !input tibber_home
  soc_sensor: !input soc_sensor
  inverter_state_sensor: !input inverter_state_sensor
  inverter_charge_value: !input inverter_charge_value
  charge_power_number: !input charge_power_number
  work_mode_select: !input work_mode_select
  work_mode_ai: !input work_mode_ai
  battery_price_sensor: !input battery_price_sensor
  force_mode_select: !input force_mode_select
  manual_mode_switch: !input manual_mode_switch
  verify_timeout: !input verify_timeout
  reload_wait: !input reload_wait
  config_entry_id: !input config_entry_id
  reload_cooldown: !input reload_cooldown
  helper_start: !input helper_start
  helper_end: !input helper_end
  helper_buy_limit: !input helper_buy_limit
  helper_last_full: !input helper_last_full
  helper_full_flag: !input helper_full_flag
  capacity_sensor: !input capacity_sensor
  max_charge_w: !input max_charge_w
  efficiency_pct: !input efficiency_pct
  min_margin_pct: !input min_margin_pct
  min_soc: !input min_soc
  max_soc: !input max_soc
  full_from_days: !input full_from_days
  full_offset_days: !input full_offset_days
  full_cheap_price: !input full_cheap_price
  peak_window_hours: !input peak_window_hours

trigger:
  - platform: time
    at: "00:05:00"
    id: plan
  - platform: time
    at: "13:05:00"
    id: plan
  - platform: time_pattern
    hours: "/1"
    minutes: "5"
    id: plan
  - platform: time_pattern
    hours: "/1"
    id: control
  - platform: state
    entity_id: !input price_sensor
    not_to:
      - unknown
      - unavailable
    not_from:
      - unknown
      - unavailable
    id: control
  - platform: state
    entity_id: !input battery_price_sensor
    not_to:
      - unknown
      - unavailable
    not_from:
      - unknown
      - unavailable
    id: control
  - platform: state
    entity_id: !input soc_sensor
    not_to:
      - unknown
      - unavailable
    not_from:
      - unknown
      - unavailable
    id: control
  - platform: state
    entity_id: !input inverter_state_sensor
    not_to:
      - unknown
      - unavailable
    not_from:
      - unknown
      - unavailable
    id: control
  - platform: homeassistant
    event: start
    id: plan

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: plan
        sequence:
          - service: tibber.get_prices
            data:
              start: "{{ now().strftime('%Y-%m-%d') }} 00:00:00"
              end: "{{ (now() + timedelta(days=2)).strftime('%Y-%m-%d') }} 00:00:00"
            response_variable: tibber_resp
          - variables:
              plan_json: >
                {% set homes = tibber_resp['prices'] if tibber_resp is defined and 'prices' in tibber_resp else {} %}
                {% set hname = tibber_home | string %}
                {% set raw = homes[hname] if hname | length > 0 and hname in homes else ((homes.values() | list)[0] if homes | length > 0 else []) %}
                {% set plan = namespace(window=[], full=false) %}
                {% if raw is sequence and (raw | length) > 1 %}
                {% set slot_h = ((as_datetime(raw[1].start_time) - as_datetime(raw[0].start_time)).total_seconds() / 3600) %}
                {% if slot_h <= 0 %}{% set slot_h = 0.25 %}{% endif %}
                {% set horizon = namespace(items=[]) %}
                {% for p in raw %}{% if p.start_time is defined and p.price is defined and as_datetime(p.start_time) >= now() - timedelta(minutes=15) %}{% set horizon.items = horizon.items + [p] %}{% endif %}{% endfor %}
                {% set dates = namespace(all=[]) %}
                {% for p in horizon.items %}{% set d = p.start_time[0:10] %}{% if d not in dates.all %}{% set dates.all = dates.all + [d] %}{% endif %}{% endfor %}
                {% set soc = states(soc_sensor) | float(50) %}
                {% set last_raw = states(helper_last_full) %}
                {% set days = namespace(n=99) %}
                {% if last_raw not in ['unknown', 'unavailable', ''] and '-' in last_raw %}
                {% set days.n = (as_datetime(now().strftime('%Y-%m-%d')) - as_datetime(last_raw[0:10])).days %}
                {% endif %}
                {% set hmin = (horizon.items | map(attribute='price') | min) if horizon.items | length > 0 else 999 %}
                {% if days.n >= ((full_from_days | int(7)) + (full_offset_days | int(10))) %}{% set plan.full = true %}
                {% elif days.n >= (full_from_days | int(7)) and hmin <= (full_cheap_price | float(0.30)) %}{% set plan.full = true %}{% endif %}
                {% set eff = 100 if plan.full else (max_soc | float(90)) %}
                {% set kapazitaet = states(capacity_sensor) | float(4.24) %}
                {% set fehlt = [(eff - soc) / 100 * kapazitaet, 0] | max %}
                {% set pro_slot = (max_charge_w | float(1200)) / 1000 * slot_h %}
                {% set n = ((fehlt / pro_slot) | round(0, 'ceil')) | int %}
                {% if n > 0 %}
                {% set wlen = (((peak_window_hours | float(4)) / slot_h) | round(0)) | int %}
                {% for d in dates.all | sort %}{% if plan.window | length == 0 %}
                {% set day = namespace(items=[]) %}
                {% for p in horizon.items %}{% if p.start_time[0:10] == d %}{% set day.items = day.items + [p] %}{% endif %}{% endfor %}
                {% set search = namespace(items=[]) %}
                {% for p in day.items %}{% if p.start_time[11:16] >= '12:00' %}{% set search.items = search.items + [p] %}{% endif %}{% endfor %}
                {% set best = namespace(avg=-1, idx=0) %}
                {% for i in range([search.items | length - wlen + 1, 1] | max) %}
                {% set w = search.items[i:i + wlen] %}
                {% if w | length == wlen %}
                {% set a = (w | map(attribute='price') | sum) / wlen %}
                {% if a > best.avg %}{% set best.avg = a %}{% set best.idx = i %}{% endif %}
                {% endif %}{% endfor %}
                {% set peak_items = search.items[best.idx:best.idx + wlen] if best.avg >= 0 else [] %}
                {% set ps = (peak_items | map(attribute='start_time') | min)[11:16] if peak_items | length > 0 else '99:99' %}
                {% set before = namespace(items=[]) %}
                {% for p in day.items %}{% if p.start_time[11:16] <= ps %}{% set before.items = before.items + [p] %}{% endif %}{% endfor %}
                {% set cheap = (before.items | sort(attribute='price'))[:n] %}
                {% if cheap | length > 0 and peak_items | length > 0 %}
                {% set buy = (cheap | map(attribute='price') | sum) / (cheap | length) %}
                {% set sell = (peak_items | map(attribute='price') | sum) / (peak_items | length) %}
                {% set eta = (efficiency_pct | float(82.9)) / 100 %}
                {% set margin = (sell * eta - buy) / buy * 100 %}
                {% if margin >= (min_margin_pct | float(5)) %}
                {% set starts = cheap | map(attribute='start_time') | list %}
                {% set t0 = (starts | min | replace('T', ' '))[0:19] %}
                {% set t1 = (as_datetime(starts | max) + timedelta(hours=slot_h)).strftime('%Y-%m-%d %H:%M:%S') %}
                {% set limit = ((cheap | map(attribute='price') | max) + 0.02) | round(4) %}
                {% set pstarts = peak_items | map(attribute='start_time') | list %}
                {% set p0 = (pstarts | min | replace('T', ' '))[0:19] %}
                {% set p1 = (as_datetime(pstarts | max) + timedelta(hours=slot_h)).strftime('%Y-%m-%d %H:%M:%S') %}
                {% set plan.window = [t0, t1, limit, d, (margin | round(1)), (buy | round(4)), (sell | round(4)), eff, p0, p1] %}
                {% endif %}{% endif %}
                {% endif %}{% endfor %}
                {% endif %}
                {% endif %}
                {{ {'window': plan.window, 'full': plan.full} | to_json }}
          - variables:
              plan_window: "{{ (plan_json | from_json)['window'] }}"
              plan_full: "{{ (plan_json | from_json)['full'] }}"
          - service: "input_boolean.turn_{{ 'on' if plan_full else 'off' }}"
            target:
              entity_id: !input helper_full_flag
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ plan_window | length == 10 }}"
                sequence:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: !input helper_start
                    data:
                      datetime: "{{ plan_window[0] }}"
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: !input helper_end
                    data:
                      datetime: "{{ plan_window[1] }}"
                  - service: input_number.set_value
                    target:
                      entity_id: !input helper_buy_limit
                    data:
                      value: "{{ plan_window[2] }}"
                  - service: persistent_notification.create
                    data:
                      title: Akku-Ladeplanung
                      notification_id: akku_ladeplanung
                      message: >
                        Aktueller Plan für {{ plan_window[3] }}{{ ' (Volladung)' if plan_full else '' }}:
                        Laden {{ plan_window[0][11:16] }}–{{ plan_window[1][11:16] }}
                        Uhr (Limit {{ plan_window[2] }} EUR/kWh),
                        Entladen in der Spitze {{ plan_window[8][11:16] }}–{{ plan_window[9][11:16] }}
                        Uhr (KI),
                        Kauf {{ plan_window[5] }}, Spitze {{ plan_window[6] }},
                        Marge {{ plan_window[4] }} %.
            default:
              - service: input_datetime.set_datetime
                target:
                  entity_id: !input helper_start
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d') }} 00:00:00"
              - service: input_datetime.set_datetime
                target:
                  entity_id: !input helper_end
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d') }} 00:00:00"
              - service: input_number.set_value
                target:
                  entity_id: !input helper_buy_limit
                data:
                  value: 0
              - service: persistent_notification.create
                data:
                  title: Akku-Ladeplanung
                  notification_id: akku_ladeplanung
                  message: Kein Ladefenster mit ausreichender Marge gefunden.
  - variables:
      soc_now: "{{ states(soc_sensor) | float(50) }}"
      eff_target: "{{ 100 if is_state(helper_full_flag, 'on') else (max_soc | float(90)) }}"
      price_now: "{{ states(price_sensor) | float(999) }}"
      buy_limit: "{{ states(helper_buy_limit) | float(999) }}"
      in_window: >
        {{ states(helper_start) not in ['unknown', 'unavailable', '']
           and states(helper_end) not in ['unknown', 'unavailable', '']
           and ' ' in states(helper_start) and ' ' in states(helper_end)
           and as_timestamp(states(helper_start)) <= as_timestamp(now()) <= as_timestamp(states(helper_end)) }}
      need_soc: "{{ (states(soc_sensor) | float(50)) < (100 if is_state(helper_full_flag, 'on') else (max_soc | float(90))) - 2 }}"
      price_ok: "{{ (states(price_sensor) | float(999)) <= (states(helper_buy_limit) | float(999)) }}"
      min_limit: "{{ min_soc | float(20) }}"
      reserve_lock: "{{ (soc_now <= min_limit) | bool }}"
      charging: "{{ (in_window | bool) and (need_soc | bool) and (price_ok | bool) }}"
      battery_price: "{{ states(battery_price_sensor) | float(0) }}"
      discharge_ok: "{{ battery_price > 0 and ((states(price_sensor) | float(999)) * ((efficiency_pct | float(82.9)) / 100) - battery_price) / battery_price * 100 >= (min_margin_pct | float(5)) }}"
      wm_state: "{{ states(work_mode_select) }}"
      fm_state: "{{ states(force_mode_select) }}"
      force_opts: "{{ state_attr(force_mode_select, 'options') | default([], true) }}"
      force_charge_opt: "{{ 'Charge' if 'Charge' in force_opts else 'charge' }}"
      force_idle_opt: >
        {%- set ns = namespace(val='STANDBY') -%}
        {%- for opt in force_opts | default([], true) -%}
          {%- if (opt | string | lower) not in ['charge', 'discharge'] -%}
            {%- if opt is none or (opt | string | lower) == 'none' -%}
              {%- set ns.val = 'NONE' -%}
            {%- else -%}
              {%- set ns.val = opt | string | upper -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.val }}
      wm_target: >
        {%- if charging | bool or reserve_lock | bool -%}manual
        {%- elif discharge_ok | bool -%}{{ work_mode_ai }}
        {%- else -%}manual
        {%- endif -%}
      fm_target: "{{ force_charge_opt if charging | bool else force_idle_opt }}"
      wm_write: >
        {%- if wm_target == work_mode_ai -%}{{ wm_state == 'manual' }}
        {%- else -%}{{ wm_state != 'manual' }}
        {%- endif -%}
      fm_write: "{{ force_opts | length > 0 and (fm_state | string | upper) != (fm_target | string | upper) }}"
      mm_write: "{{ charging | bool and states(manual_mode_switch) != 'on' }}"
      charge_state: "{{ states(inverter_state_sensor) }}"
      need_charge_setup: "{{ (charging | bool) and ((mm_write | bool) or (fm_write | bool) or (charge_state | string | trim | lower) != (inverter_charge_value | string | trim | lower)) }}"
      reload_ready: >
        {%- set eid = config_entry_id | default('', true) | string | trim -%}
        {%- set cd = reload_cooldown | default('', true) | string | trim -%}
        {%- if eid | length == 0 -%}false
        {%- elif cd | length == 0 -%}true
        {%- elif cd in ['unknown', 'unavailable'] or '-' not in cd -%}true
        {%- elif (as_timestamp(now()) - as_timestamp(cd)) > 21600 -%}true
        {%- else -%}false
        {%- endif -%}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ soc_now >= 99 }}"
        sequence:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input helper_last_full
            data:
              date: "{{ now().strftime('%Y-%m-%d') }}"
          - service: input_boolean.turn_off
            target:
              entity_id: !input helper_full_flag
    default: []
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging | bool and need_charge_setup | bool }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wm_write | bool }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input work_mode_select
                    data:
                      option: manual
          - service: switch.turn_on
            target:
              entity_id: !input manual_mode_switch
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ force_opts | length > 0 }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input force_mode_select
                    data:
                      option: "{{ force_charge_opt }}"
          - service: number.set_value
            target:
              entity_id: !input charge_power_number
            data:
              value: "{{ max_charge_w }}"
          - wait_template: "{{ charge_state | string | trim | lower == (inverter_charge_value | string | trim | lower) }}"
            timeout: "00:00:{{ verify_timeout | int(15) }}"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed and reload_ready | bool }}"
                sequence:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: !input reload_cooldown
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - service: homeassistant.reload_config_entry
                    data:
                      config_entry_id: "{{ config_entry_id }}"
                  - delay:
                      seconds: "{{ reload_wait | int(30) }}"
                      milliseconds: 0
                      minutes: 0
                  - service: switch.turn_on
                    target:
                      entity_id: !input manual_mode_switch
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ force_opts | length > 0 }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: !input force_mode_select
                            data:
                              option: "{{ force_charge_opt }}"
                  - service: number.set_value
                    target:
                      entity_id: !input charge_power_number
                    data:
                      value: "{{ max_charge_w }}"
                  - wait_template: "{{ states(inverter_state_sensor) | string | trim | lower == (inverter_charge_value | string | trim | lower) }}"
                    timeout: "00:00:{{ verify_timeout | int(15) }}"
                    continue_on_timeout: true
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not wait.completed }}"
                        sequence:
                          - service: persistent_notification.create
                            data:
                              title: Akku-Ladeplanung
                              notification_id: akku_ladeplanung_reload
                              message: >
                                Die Omnibattery-Integration wurde neu geladen und
                                die Ladeeinstellungen wurden wiederholt, aber der
                                Wechselrichter ging nicht auf
                                „{{ inverter_charge_value }}". Manuell prüfen:
                                Battery Manual Mode, Force Mode und Ladeleistung.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wm_target == 'manual' and not (charging | bool and need_charge_setup | bool) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wm_write | bool }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input work_mode_select
                    data:
                      option: manual
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ mm_write | bool }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input manual_mode_switch
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ fm_write | bool }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ force_idle_opt == 'NONE' }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: !input force_mode_select
                            data:
                              option: "None"
                      - conditions:
                          - condition: template
                            value_template: "{{ force_idle_opt != 'NONE' }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: !input force_mode_select
                            data:
                              option: "{{ force_idle_opt | lower }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wm_target != 'manual' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ fm_write | bool }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ force_idle_opt == 'NONE' }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: !input force_mode_select
                            data:
                              option: "None"
                      - conditions:
                          - condition: template
                            value_template: "{{ force_idle_opt != 'NONE' }}"
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: !input force_mode_select
                            data:
                              option: "{{ force_idle_opt | lower }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wm_write | bool }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input work_mode_select
                    data:
                      option: "{{ wm_target }}"
